<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Equalizer — Day 100 mile branded</title>
<style>
  :root { color-scheme: dark; }
  body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#0b0b0c;color:#f2f2f2;}
  main{max-width:640px;margin:0 auto;padding:20px 16px 40px;}
  h1{font-size:18px;margin:0 0 6px;}
  p{opacity:.75;font-size:14px;margin:0 0 16px;line-height:1.4;}
  video,img{width:100%;border-radius:14px;background:#000;aspect-ratio:16/9;object-fit:contain;display:block;}
  img{margin-top:18px;}
  .row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  a.btn{flex:1;min-width:140px;text-align:center;text-decoration:none;color:#fff;background:#2f6fed;padding:14px 12px;border-radius:12px;font-weight:600;font-size:15px;}
  .hint{margin-top:14px;font-size:13px;opacity:.65}
</style>
</head>
<body>
<main>
  <h1>Day 100 mile — branded clip</h1>
  <p>Equalizer draft · static DAY 100 / DON'T BLINK + Equalizer|Sonic · shield morph still in underlay · tap play · Share → Save Video</p>
  <video controls playsinline webkit-playsinline preload="metadata" src="./video.mp4"></video>
  <div class="row">
    <a class="btn" href="./video.mp4" download="eq-day100-mile-branded-v1.mp4">Download MP4</a>
    <a class="btn" href="./still.png" download="eq-day100-mile-v1.png">Download still</a>
  </div>
  <img src="./still.png" alt="Day 100 mile still plate"/>
  <p class="hint">iPhone tip: open in Safari → share sheet → Save Video / Save Image.</p>
</main>
</body>
</html>
